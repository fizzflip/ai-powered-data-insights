      <text x="10" y="32" font-family="'Space Mono', monospace" font-size="8" fill="#D5B9F3">Cluster #03: Space Western</text>
      <text x="10" y="47" font-family="'Space Mono', monospace" font-size="8" fill="#4DF0D2">Score: 8.75 | Devotion: 94.2%</text>
    </g>
  </g>

  <!-- Center Bottom Data Inspector Table -->
