    <g fill="#4DF0D2" opacity="0.65">
      <circle cx="160" cy="90" r="2.5"/><circle cx="172" cy="84" r="2"/><circle cx="180" cy="98" r="3"/><circle cx="150" cy="105" r="2"/>
      <circle cx="195" cy="110" r="2.5"/><circle cx="210" cy="85" r="2"/><circle cx="165" cy="118" r="2"/><circle cx="185" cy="125" r="3"/>
    </g>
    <!-- Centroid #03 -->
    <polygon points="175,95 181,102 175,109 169,102" fill="#4DF0D2" filter="url(#cyanGlow)"/>

    <!-- Cluster #07: Time Dilation (Star Gold #FCE277) -->
    <g fill="#FCE277" opacity="0.65">
      <circle cx="380" cy="75" r="2"/><circle cx="395" cy="65" r="3"/><circle cx="410" cy="82" r="2.5"/><circle cx="370" cy="95" r="2"/>
      <circle cx="425" cy="70" r="2"/><circle cx="385" cy="105" r="2.5"/><circle cx="440" cy="90" r="3"/><circle cx="400" cy="115" r="2"/>
    </g>
    <!-- Centroid #07 -->
    <polygon points="400,82 406,89 400,96 394,89" fill="#FCE277" filter="url(#goldGlow)"/>

    <!-- Cluster #11: Cyberpunk / Philosophy (Lilac Quartz #D5B9F3) -->
    <g fill="#D5B9F3" opacity="0.65">
      <circle cx="470" cy="165" r="2.5"/><circle cx="485" cy="155" r="2"/><circle cx="505" cy="170" r="3"/><circle cx="460" cy="180" r="2"/>
      <circle cx="520" cy="150" r="2.5"/><circle cx="490" cy="190" r="2"/><circle cx="535" cy="175" r="3"/><circle cx="510" cy="195" r="2"/>
    </g>
    <!-- Centroid #11 -->
    <polygon points="495,170 501,177 495,184 489,177" fill="#D5B9F3"/>

    <!-- Cluster #14: Slice of Life / Iyashikei (Terracotta Rose #CFA7AA) -->
    <g fill="#CFA7AA" opacity="0.65">
      <circle cx="270" cy="175" r="2"/><circle cx="285" cy="160" r="3"/><circle cx="300" cy="182" r="2.5"/><circle cx="260" cy="195" r="2"/>
      <circle cx="315" cy="168" r="2.5"/><circle cx="280" cy="205" r="2"/><circle cx="330" cy="190" r="3"/><circle cx="295" cy="215" r="2"/>
    </g>

    <!-- Hovered Node: Cowboy Bebop -->
    <circle cx="180" cy="98" r="7" fill="none" stroke="#4DF0D2" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="180" cy="98" r="4" fill="#FFFFFF"/>

