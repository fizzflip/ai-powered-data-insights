<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#251C58"/>
      <stop offset="50%" stop-color="#140C37"/>
      <stop offset="100%" stop-color="#0E0725"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A123E"/>
      <stop offset="100%" stop-color="#140C37"/>
    </linearGradient>
    <linearGradient id="btnActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E58A3"/>
      <stop offset="100%" stop-color="#8A72C4"/>
    </linearGradient>
    <filter id="windowShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05030E" flood-opacity="0.85"/>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#4DF0D2" flood-opacity="0.9"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FCE277" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="1000" height="640" fill="#6E58A3"/>
  <rect width="1000" height="640" fill="url(#bgGrad)" opacity="0.6"/>

  <!-- Subtle Stardust -->
  <g fill="#FCE277" opacity="0.35">
    <circle cx="80" cy="90" r="1"/>
    <circle cx="920" cy="110" r="1.5"/>
    <circle cx="890" cy="580" r="1"/>
    <circle cx="110" cy="550" r="1.2"/>
    <polygon points="940,80 942,85 947,87 942,89 940,94 938,89 933,87 938,85" fill="#FCE277" opacity="0.7"/>
    <polygon points="60,600 62,604 66,605 62,607 60,611 58,607 54,605 58,604" fill="#FCE277" opacity="0.6"/>
  </g>

  <!-- macOS Browser Window Shell -->
  <g filter="url(#windowShadow)">
    <rect x="40" y="30" width="920" height="580" rx="14" fill="#140C37" stroke="#6E58A3" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <path d="M40,44 A14,14 0 0,1 54,30 L946,30 A14,14 0 0,1 960,44 L960,74 L40,74 Z" fill="#1C1344"/>
    <line x1="40" y1="74" x2="960" y2="74" stroke="#251C58" stroke-width="1.5"/>

    <!-- Traffic Lights -->
    <circle cx="68" cy="52" r="6" fill="#FF5F56"/>
    <circle cx="88" cy="52" r="6" fill="#FFBD2E"/>
    <circle cx="108" cy="52" r="6" fill="#27C93F"/>

    <!-- Address Pill -->
    <rect x="220" y="41" width="560" height="24" rx="12" fill="#140C37" stroke="#251C58" stroke-width="1"/>
    <g transform="translate(232, 47)">
      <path d="M4,1.5 A2.5,2.5 0 0,0 1.5,4 L1.5,5 L6.5,5 L6.5,4 A2.5,2.5 0 0,0 4,1.5 Z M0.5,5 L7.5,5 L7.5,11 L0.5,11 Z" fill="#4DF0D2"/>
    </g>
    <text x="246" y="57" font-family="'Space Mono', monospace" font-size="11" fill="#D5B9F3" letter-spacing="0.04em">https://insights.anime.ai/marimo-dag</text>
    <rect x="715" y="46" width="54" height="14" rx="7" fill="#251C58"/>
    <text x="722" y="56" font-family="'Space Mono', monospace" font-size="8" font-weight="700" fill="#4DF0D2">DAG: OK</text>
  </g>

  <!-- Left Sidebar (Marimo Reactive Controls) -->
  <g transform="translate(40, 74)">
    <rect x="0" y="0" width="260" height="536" fill="#18103A"/>
    <line x1="260" y1="0" x2="260" y2="536" stroke="#251C58" stroke-width="1.5"/>

    <!-- Sidebar Header -->
    <text x="22" y="32" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#FAC4A7" letter-spacing="0.1em">MARIMO REACTIVE DAG</text>
    <circle cx="236" cy="28" r="4" fill="#4DF0D2" filter="url(#cyanGlow)"/>

    <!-- Origin Filter Pills -->
    <text x="22" y="66" font-family="'Space Mono', monospace" font-size="9" fill="#D5B9F3">ORIGIN FILTER</text>
    <rect x="20" y="76" width="220" height="32" rx="8" fill="#140C37" stroke="#251C58" stroke-width="1"/>
    <rect x="22" y="78" width="106" height="28" rx="6" fill="url(#btnActive)"/>
    <text x="50" y="96" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF">JP ANIME</text>
    <text x="146" y="96" font-family="'Space Mono', monospace" font-size="10" fill="#CFA7AA">GLOBAL / ONA</text>

    <!-- Cluster Count Slider (k = 18) -->
    <text x="22" y="142" font-family="'Space Mono', monospace" font-size="9" fill="#D5B9F3">ARCHETYPE CLUSTERS (k)</text>
    <rect x="186" y="132" width="54" height="16" rx="4" fill="#251C58"/>
    <text x="194" y="144" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FCE277">k = 18</text>
    <!-- Slider Track -->
    <rect x="22" y="156" width="218" height="6" rx="3" fill="#140C37"/>
    <rect x="22" y="156" width="150" height="6" rx="3" fill="#6E58A3"/>
    <circle cx="172" cy="159" r="8" fill="#140C37" stroke="#FCE277" stroke-width="2" filter="url(#goldGlow)"/>

    <!-- MAL Score Threshold Slider -->
    <text x="22" y="202" font-family="'Space Mono', monospace" font-size="9" fill="#D5B9F3">MIN MAL SCORE</text>
    <rect x="186" y="192" width="54" height="16" rx="4" fill="#251C58"/>
    <text x="194" y="204" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#4DF0D2">≥ 7.50</text>
    <rect x="22" y="216" width="218" height="6" rx="3" fill="#140C37"/>
    <rect x="22" y="216" width="138" height="6" rx="3" fill="#4DF0D2"/>
    <circle cx="160" cy="219" r="8" fill="#140C37" stroke="#4DF0D2" stroke-width="2" filter="url(#cyanGlow)"/>

    <!-- Popularity Rank Brush -->
    <text x="22" y="262" font-family="'Space Mono', monospace" font-size="9" fill="#D5B9F3">POPULARITY BRUSH</text>
    <g transform="translate(22, 276)">
      <rect width="218" height="42" fill="#140C37" rx="4" stroke="#251C58" stroke-width="1"/>
