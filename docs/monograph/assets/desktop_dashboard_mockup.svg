      <line x1="30" y1="100" x2="590" y2="100"/>
      <line x1="30" y1="150" x2="590" y2="150"/>
      <line x1="30" y1="200" x2="590" y2="200"/>
      <line x1="120" y1="40" x2="120" y2="230"/>
      <line x1="240" y1="40" x2="240" y2="230"/>
      <line x1="360" y1="40" x2="360" y2="230"/>
