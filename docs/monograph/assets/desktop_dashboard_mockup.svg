      <rect x="8" y="24" width="8" height="14" fill="#6E58A3" opacity="0.4"/>
      <rect x="20" y="16" width="8" height="22" fill="#6E58A3" opacity="0.4"/>
      <rect x="32" y="10" width="8" height="28" fill="#6E58A3" opacity="0.4"/>
      <!-- Active Brush Selection -->
      <rect x="44" y="6" width="8" height="32" fill="#FAC4A7"/>
      <rect x="56" y="4" width="8" height="34" fill="#FAC4A7"/>
      <rect x="68" y="8" width="8" height="30" fill="#FAC4A7"/>
      <rect x="80" y="12" width="8" height="26" fill="#FAC4A7"/>
      <rect x="92" y="18" width="8" height="20" fill="#FAC4A7"/>
      <rect x="104" y="22" width="8" height="16" fill="#FAC4A7"/>
      <rect x="116" y="26" width="8" height="12" fill="#6E58A3" opacity="0.4"/>
      <rect x="128" y="30" width="8" height="8" fill="#6E58A3" opacity="0.4"/>
      <rect x="140" y="32" width="8" height="6" fill="#6E58A3" opacity="0.4"/>
      <!-- Brush Handles -->
      <rect x="42" y="2" width="60" height="38" fill="none" stroke="#FCE277" stroke-dasharray="2,2"/>
    </g>

