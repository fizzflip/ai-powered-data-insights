    <text x="24" y="52" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" fill="#D5B9F3">TITLE</text>
    <text x="210" y="52" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" fill="#D5B9F3">ARCHETYPE CLUSTER</text>
    <text x="360" y="52" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" fill="#D5B9F3">SCORE</text>
    <text x="440" y="52" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" fill="#D5B9F3">DEVOTION</text>
    <text x="540" y="52" font-family="'Space Mono', monospace" font-size="8.5" font-weight="700" fill="#D5B9F3">ORIGIN</text>

