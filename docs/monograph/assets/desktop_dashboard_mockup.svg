    <g transform="translate(14, 62)">
      <rect width="592" height="36" fill="#1C1445" opacity="0.6"/>
      <text x="10" y="22" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF">Cowboy Bebop</text>
      <rect x="194" y="9" width="112" height="18" rx="4" fill="#251C58"/>
      <text x="200" y="22" font-family="'Space Mono', monospace" font-size="8" fill="#4DF0D2">#03 Space Western</text>
      <text x="348" y="22" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FCE277">★ 8.75</text>
      <!-- Devotion Bar -->
      <rect x="426" y="14" width="70" height="8" rx="4" fill="#140C37"/>
      <rect x="426" y="14" width="66" height="8" rx="4" fill="#4DF0D2"/>
      <text x="502" y="22" font-family="'Space Mono', monospace" font-size="8" fill="#4DF0D2">94%</text>
      <text x="526" y="22" font-family="'Space Mono', monospace" font-size="8.5" fill="#D5B9F3">[JP] Sunrise</text>
    </g>

    <!-- Row 2: Steins;Gate -->
    <g transform="translate(14, 100)">
      <rect width="592" height="36" fill="#140C37" opacity="0.6"/>
      <text x="10" y="22" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF">Steins;Gate</text>
      <rect x="194" y="9" width="112" height="18" rx="4" fill="#251C58"/>
      <text x="200" y="22" font-family="'Space Mono', monospace" font-size="8" fill="#FCE277">#07 Time Dilation</text>
      <text x="348" y="22" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FCE277">★ 9.08</text>
      <rect x="426" y="14" width="70" height="8" rx="4" fill="#140C37"/>
      <rect x="426" y="14" width="68" height="8" rx="4" fill="#FCE277"/>
      <text x="502" y="22" font-family="'Space Mono', monospace" font-size="8" fill="#FCE277">97%</text>
      <text x="526" y="22" font-family="'Space Mono', monospace" font-size="8.5" fill="#D5B9F3">[JP] White Fox</text>
    </g>

    <!-- Row 3: Ghost in the Shell -->
    <g transform="translate(14, 138)">
      <rect width="592" height="36" fill="#1C1445" opacity="0.6"/>
      <text x="10" y="22" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF">Ghost in the Shell</text>
      <rect x="194" y="9" width="112" height="18" rx="4" fill="#251C58"/>
      <text x="200" y="22" font-family="'Space Mono', monospace" font-size="8" fill="#D5B9F3">#11 Cyberpunk</text>
      <text x="348" y="22" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FCE277">★ 8.68</text>
      <rect x="426" y="14" width="70" height="8" rx="4" fill="#140C37"/>
      <rect x="426" y="14" width="62" height="8" rx="4" fill="#D5B9F3"/>
      <text x="502" y="22" font-family="'Space Mono', monospace" font-size="8" fill="#D5B9F3">89%</text>
      <text x="526" y="22" font-family="'Space Mono', monospace" font-size="8.5" fill="#D5B9F3">[JP] Prod. I.G</text>
    </g>

    <!-- Row 4: The King's Avatar -->
    <g transform="translate(14, 176)">
      <rect width="592" height="36" fill="#140C37" opacity="0.6"/>
      <text x="10" y="22" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF">The King's Avatar</text>
      <rect x="194" y="9" width="112" height="18" rx="4" fill="#251C58"/>
      <text x="200" y="22" font-family="'Space Mono', monospace" font-size="8" fill="#CFA7AA">#15 Esports Strat</text>
      <text x="348" y="22" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FCE277">★ 8.21</text>
      <rect x="426" y="14" width="70" height="8" rx="4" fill="#140C37"/>
      <rect x="426" y="14" width="55" height="8" rx="4" fill="#CFA7AA"/>
      <text x="502" y="22" font-family="'Space Mono', monospace" font-size="8" fill="#CFA7AA">78%</text>
      <text x="526" y="22" font-family="'Space Mono', monospace" font-size="8.5" fill="#FAC4A7">[CN] B.CMAY</text>
