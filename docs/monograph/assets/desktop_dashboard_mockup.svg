      <rect width="220" height="144" rx="8" fill="#140C37" stroke="#251C58" stroke-width="1"/>
      <text x="14" y="24" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FAC4A7">DAG EXECUTION TELEMETRY</text>
