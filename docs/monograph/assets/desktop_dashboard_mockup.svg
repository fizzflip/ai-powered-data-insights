      <circle cx="0" cy="0" r="3.5" fill="#4DF0D2"/>
      <text x="7" y="3" font-family="'Space Mono', monospace" font-size="8" fill="#D5B9F3">Space West.</text>
      <circle cx="75" cy="0" r="3.5" fill="#FCE277"/>
      <text x="82" y="3" font-family="'Space Mono', monospace" font-size="8" fill="#D5B9F3">Time Dil.</text>
      <circle cx="140" cy="0" r="3.5" fill="#D5B9F3"/>
      <text x="147" y="3" font-family="'Space Mono', monospace" font-size="8" fill="#D5B9F3">Cyberpunk</text>
