      <text x="14" y="86" font-family="'Space Mono', monospace" font-size="8.5" fill="#D5B9F3">● Cell 09 (K-Means): <tspan fill="#4DF0D2">6.4ms</tspan></text>
      <text x="14" y="106" font-family="'Space Mono', monospace" font-size="8.5" fill="#D5B9F3">● Cell 14 (t-SNE 2D): <tspan fill="#FCE277">11.8ms</tspan></text>
