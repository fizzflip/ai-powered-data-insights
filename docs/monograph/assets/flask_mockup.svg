<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5DE93"/>
      <stop offset="30%" stop-color="#C89E48"/>
      <stop offset="70%" stop-color="#7D5E20"/>
      <stop offset="100%" stop-color="#C89E48"/>
    </linearGradient>
    <pattern id="knurlPattern" width="4" height="12" patternUnits="userSpaceOnUse">
      <rect width="2" height="12" fill="#5A4214"/>
      <rect x="2" width="2" height="12" fill="#FCE59F"/>
    </pattern>
    <linearGradient id="glassChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(213, 185, 243, 0.28)"/>
      <stop offset="40%" stop-color="rgba(171, 154, 220, 0.12)"/>
      <stop offset="100%" stop-color="rgba(20, 12, 55, 0.45)"/>
    </linearGradient>
    <linearGradient id="cosmicFluid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#251C58"/>
      <stop offset="50%" stop-color="#180F3E"/>
      <stop offset="100%" stop-color="#140C37"/>
    </linearGradient>
    <radialGradient id="saturnGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FAC4A7"/>
      <stop offset="50%" stop-color="#CFA7AA"/>
      <stop offset="100%" stop-color="#503C8F"/>
    </radialGradient>
    <filter id="flaskDrop" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#080416" flood-opacity="0.8"/>
    </filter>
    <filter id="starTwinkle" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FCE277" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Wisteria Violet Canvas Ground -->
  <rect width="500" height="700" fill="#6E58A3"/>

  <!-- Subtle Apothecary Grid Background -->
  <g stroke="#8A74C4" stroke-width="0.8" opacity="0.25">
    <line x1="50" y1="0" x2="50" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="700"/>
    <line x1="250" y1="0" x2="250" y2="700"/>
    <line x1="350" y1="0" x2="350" y2="700"/>
    <line x1="450" y1="0" x2="450" y2="700"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="0" y1="550" x2="500" y2="550"/>
  </g>

  <!-- Ambient 4-Point Celestial Diamonds Outside Flask -->
  <g fill="#FCE277" filter="url(#starTwinkle)">
    <!-- Top Left -->
    <polygon points="65,90 68,98 76,101 68,104 65,112 62,104 54,101 62,98"/>
    <!-- Top Right -->
    <polygon points="435,130 437,136 443,138 437,140 435,146 433,140 427,138 433,136"/>
    <!-- Bottom Left -->
    <polygon points="50,560 52,565 57,567 52,569 50,574 48,569 43,567 48,565"/>
    <!-- Bottom Right -->
    <polygon points="440,590 443,597 450,600 443,603 440,610 437,603 430,600 437,597"/>
  </g>

  <!-- DECANTER VESSEL CHASSIS -->
  <g filter="url(#flaskDrop)">
    <!-- 1. Knurled Brass Stopper Assembly -->
    <g transform="translate(190, 48)">
      <!-- Main Stopper Cap -->
      <rect x="10" y="0" width="100" height="28" rx="5" fill="url(#brassGrad)" stroke="#E5C365" stroke-width="1.2"/>
      <!-- Knurled Lathe Section -->
      <rect x="10" y="8" width="100" height="12" fill="url(#knurlPattern)"/>
      <!-- Screw Threads -->
      <rect x="20" y="28" width="80" height="5" rx="1.5" fill="#C89E48"/>
      <line x1="22" y1="30" x2="98" y2="30" stroke="#FCE59F" stroke-width="1.5"/>
      <rect x="24" y="34" width="72" height="4" rx="1.5" fill="#7D5E20"/>
      <!-- Telemetry Seal Pill -->
      <rect x="12" y="42" width="96" height="15" rx="7.5" fill="#140C37" stroke="#D5B9F3" stroke-width="1"/>
      <circle cx="22" cy="49.5" r="3" fill="#4DF0D2"/>
      <text x="30" y="53" font-family="'Space Mono', monospace" font-size="7" font-weight="700" fill="#FFFFFF">SEAL: 0.024G HERMETIC</text>
    </g>

    <!-- 2. Glass Flask Collar & Neck -->
    <g transform="translate(185, 110)">
      <path d="M15,0 L115,0 L125,28 L5,28 Z" fill="url(#glassChassis)" stroke="#E7D2F3" stroke-width="1.5"/>
      <!-- Dual Glass Ridge Highlights -->
      <rect x="8" y="8" width="114" height="2.5" rx="1" fill="#FFFFFF" opacity="0.7"/>
      <rect x="4" y="20" width="122" height="2.5" rx="1" fill="#FFFFFF" opacity="0.6"/>
    </g>

    <!-- 3. Glass Decanter Body -->
    <g transform="translate(90, 138)">
      <!-- Base Slab Shadow -->
      <rect x="0" y="0" width="320" height="490" rx="36" fill="url(#glassChassis)" stroke="#E7D2F3" stroke-width="2"/>
      
      <!-- Inner Chamber Boundary -->
      <rect x="6" y="6" width="308" height="478" rx="30" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.25"/>

      <!-- Liquid Meniscus & Cosmic Liquid Mass -->
      <!-- Meniscus adheres upward at x=12 and x=308, curving down at center -->
      <path d="M 12,120 Q 160,136 308,120 L 308,460 Q 308,478 280,478 L 40,478 Q 12,478 12,460 Z" fill="url(#cosmicFluid)"/>
      
      <!-- Surface Meniscus Glowing Line -->
      <path d="M 12,120 Q 160,136 308,120" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.85"/>
      <path d="M 12,121 Q 160,137 308,121" stroke="#D5B9F3" stroke-width="4" fill="none" opacity="0.4"/>

      <!-- CELESTIAL ELEMENTS INSIDE LIQUID -->
      <!-- Ringed Saturnian Gas Giant -->
      <g transform="translate(235, 175)">
        <!-- Planet Sphere -->
        <circle cx="30" cy="30" r="26" fill="url(#saturnGrad)"/>
        <!-- Atmospheric Bands -->
        <path d="M6,22 C14,24 38,24 54,20" stroke="#FAC4A7" stroke-width="2" fill="none" opacity="0.7"/>
        <path d="M4,34 C16,36 42,36 56,31" stroke="#503C8F" stroke-width="2" fill="none" opacity="0.8"/>
        <!-- Ring (Tilted at authentic -24 deg) -->
        <ellipse cx="30" cy="30" rx="54" ry="14" fill="none" stroke="#FCE277" stroke-width="4.5" transform="rotate(-24, 30, 30)"/>
        <ellipse cx="30" cy="30" rx="60" ry="16" fill="none" stroke="#FAC4A7" stroke-width="1.5" transform="rotate(-24, 30, 30)" opacity="0.6"/>
      </g>

      <!-- Twinkling 4-Point Astroid Stars Inside Chamber -->
      <g fill="#FCE277" opacity="0.9">
        <polygon points="70,180 72,185 77,187 72,189 70,194 68,189 63,187 68,185"/>
        <polygon points="175,160 178,168 186,170 178,172 175,180 172,172 164,170 172,168"/>
        <polygon points="260,340 262,345 267,347 262,349 260,354 258,349 253,347 258,345"/>
        <polygon points="85,380 87,384 91,385 87,386 85,390 83,386 79,385 83,384"/>
      </g>

      <!-- Floating Zero-G Astronaut -->
      <g transform="translate(195, 290)">
        <!-- Life Support Backpack -->
        <rect x="6" y="8" width="14" height="28" rx="4" fill="#251C58" stroke="#D5B9F3" stroke-width="1.5"/>
        <rect x="8" y="12" width="10" height="6" rx="2" fill="#4DF0D2" opacity="0.7"/>
        
        <!-- Torso & Suit Body -->
        <path d="M16,14 C16,10 32,10 34,14 L36,36 C36,42 16,42 16,36 Z" fill="#E7D2F3" stroke="#140C37" stroke-width="1.8"/>
        
        <!-- Helmet & Golden Visor -->
        <circle cx="26" cy="10" r="10" fill="#E7D2F3" stroke="#140C37" stroke-width="1.8"/>
        <ellipse cx="28" cy="10" rx="6.5" ry="4.5" fill="#FCE277" stroke="#140C37" stroke-width="1"/>
        <ellipse cx="27" cy="8.5" rx="3.5" ry="1.5" fill="#FFFFFF" opacity="0.8"/>

        <!-- Relaxed Floating Limbs -->
        <!-- Arms -->
        <path d="M18,16 Q 10,18 6,10" stroke="#E7D2F3" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <path d="M18,16 Q 10,18 6,10" stroke="#140C37" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M33,18 Q 42,22 46,16" stroke="#E7D2F3" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <path d="M33,18 Q 42,22 46,16" stroke="#140C37" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <!-- Legs in Zero-G Drift -->
        <path d="M20,38 Q 16,48 10,58" stroke="#E7D2F3" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M20,38 Q 16,48 10,58" stroke="#140C37" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M31,38 Q 36,48 42,56" stroke="#E7D2F3" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M31,38 Q 36,48 42,56" stroke="#140C37" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </g>

      <!-- 4. Axonometric Apothecary Label (Skewed 3D Projection) -->
      <g transform="matrix(0.98, 0.05, -0.19, 0.98, 38, 220)">
        <!-- Label Paper Ground (Peach Cream Parchment) -->
        <rect width="144" height="190" rx="3" fill="#FAC4A7" stroke="#D4BC94" stroke-width="1.8"/>
        <!-- Inner Decorative Inking Border -->
        <rect x="5" y="5" width="134" height="180" rx="2" fill="none" stroke="#2C211B" stroke-width="0.8" stroke-dasharray="4,2"/>

        <!-- Label Typography in Sumi Ink -->
        <g fill="#2C211B">
          <text x="12" y="24" font-family="'Space Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.08em">SPACE JUICE</text>
          <text x="12" y="36" font-family="'Space Mono', monospace" font-size="6" letter-spacing="0.06em">FROM THE MILKY WAY</text>
          <line x1="12" y1="42" x2="132" y2="42" stroke="#2C211B" stroke-width="1"/>

          <!-- Japanese Inscription -->
          <text x="12" y="60" font-family="'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="700">宇宙 にはたくさんの</text>
          <text x="12" y="74" font-family="'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="700">銀河がある。</text>

          <!-- Red Vermilion Prescription Seal -->
          <g transform="translate(98, 48)">
            <rect width="26" height="26" rx="2" fill="none" stroke="#E07A5F" stroke-width="1.5"/>
            <text x="4" y="16" font-family="'Shippori Mincho', serif" font-size="9" font-weight="700" fill="#E07A5F">純粋</text>
          </g>

          <!-- Chemical Spec Formula Table -->
          <line x1="12" y1="88" x2="132" y2="88" stroke="#D4BC94" stroke-width="0.8"/>
          <text x="12" y="100" font-family="'Space Mono', monospace" font-size="6" fill="#2C211B">WISTERIA: 420mg</text>
          <text x="12" y="112" font-family="'Space Mono', monospace" font-size="6" fill="#2C211B">QUARTZ:   18.5mg</text>
          <text x="12" y="124" font-family="'Space Mono', monospace" font-size="6" fill="#2C211B">INDIGO:   120μL</text>

          <!-- Telemetry Row -->
          <line x1="12" y1="134" x2="132" y2="134" stroke="#D4BC94" stroke-dasharray="2,2"/>
          <text x="12" y="146" font-family="'Space Mono', monospace" font-size="6" font-weight="700">● H2O 500ml ● H·II·VII</text>

          <!-- Barcode Strip -->
          <g transform="translate(12, 154)">
            <rect x="0" y="0" width="2" height="14" fill="#2C211B"/>
            <rect x="4" y="0" width="1" height="14" fill="#2C211B"/>
            <rect x="7" y="0" width="3" height="14" fill="#2C211B"/>
            <rect x="12" y="0" width="1.5" height="14" fill="#2C211B"/>
            <rect x="16" y="0" width="4" height="14" fill="#2C211B"/>
            <rect x="22" y="0" width="2" height="14" fill="#2C211B"/>
            <rect x="26" y="0" width="1" height="14" fill="#2C211B"/>
            <rect x="30" y="0" width="3.5" height="14" fill="#2C211B"/>
            <rect x="36" y="0" width="2" height="14" fill="#2C211B"/>
            <rect x="40" y="0" width="1" height="14" fill="#2C211B"/>
            <rect x="43" y="0" width="3" height="14" fill="#2C211B"/>
            <rect x="48" y="0" width="2" height="14" fill="#2C211B"/>
            <text x="56" y="12" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700">№ 14777</text>
          </g>
        </g>
      </g>

      <!-- Glass Specular Reflection Streaks (Primary & Secondary) -->
      <rect x="16" y="24" width="5" height="420" rx="2.5" fill="url(#brassGrad)" opacity="0.1"/>
      <rect x="16" y="24" width="4" height="420" rx="2" fill="#FFFFFF" opacity="0.65"/>
      <rect x="26" y="44" width="2" height="360" rx="1" fill="#D5B9F3" opacity="0.45"/>
      <!-- Right Edge Caustic Reflection -->
      <rect x="300" y="30" width="3" height="400" rx="1.5" fill="#E7D2F3" opacity="0.35"/>
      <!-- Bottom Thick Glass Slab Rim -->
      <path d="M 30,475 Q 160,485 290,475" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.4"/>
    </g>
  </g>
</svg>
